<body>
    <div id="contenedor_anuncios">
        <div id="anunciero">
            XTRACHALLENGE 2024
        </div>
    </div>

    <script>
        const socket = io();

        // Asegurarse de que el DOM esté completamente cargado
        document.addEventListener("DOMContentLoaded", function() {
            let contenedor_anuncio = document.querySelector("#contenedor_anuncios");
            let anuncio = document.querySelector("#anunciero");
            let anuncio_visible = true;

            socket.on("anuncio", (info) => {
                let comando = info.shift();
                switch (comando) {
                    case "updateText":
                        anuncio.textContent = info[0];
                        break;
                    case "dinamicaAnuncio":
                        // Cambiar la posición del anuncio
                        let movimiento = anuncio_visible ? "-100px" : "0px";
                        contenedor_anuncio.style.top = movimiento;

                        // Invertimos el estado de visibilidad
                        anuncio_visible = !anuncio_visible;
                        break;
                }
            });
        });
    </script>
</body>
</html>
