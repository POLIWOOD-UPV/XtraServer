<!DOCTYPE html>
<html lang="en" xmlns:mso="urn:schemas-microsoft-com:office:office" xmlns:msdt="uuid:C2F41010-65B3-11d1-A29F-00AA00C14882">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <script src="./js/RondaEquipo.js"></script>
    <script>
        var rondaEquipo;
        var response;
        var conversion;
    </script>
    <script>
        const loadJSON = async () => {
            response = (await fetch("/data/carga.json"));
            conversion = await response.json();
        }

        const preparar_calculo_bolas = () => {
            var input_billar = document.querySelector("#billar");
            var input_ping = document.querySelector("#ping");
            var input_peso = document.querySelector("#peso");
            var input_volumen = document.querySelector("#volumen");

            input_billar.addEventListener("input", () => {
                input_peso.value = input_billar.value * conversion.billar.peso
                                + input_ping.value * conversion.ping.peso;
                input_volumen.value = input_billar.value * conversion.billar.volumen
                                + input_ping.value * conversion.ping.volumen;
            });

            input_ping.addEventListener("input", () => {
                input_peso.value = input_billar.value * conversion.billar.peso
                                + input_ping.value * conversion.ping.peso;
                input_volumen.value = input_billar.value * conversion.billar.volumen
                                + input_ping.value * conversion.ping.volumen;
            });
        };

        const preparar_checkbox = () => {
            var inputs = document.querySelectorAll("form input['type'='checkbox']");
            inputs.forEach((element) => {
                element.setAttribute("input", () => {
                    self.value = (self.checked)? "on": "";
                });
            });
        }

        addEventListener("DOMContentLoaded", async () => {
            rondaEquipo = new RondaEquipo();
            await rondaEquipo.get_dependencies();

            await loadJSON();

            if (rondaEquipo.ronda != null && rondaEquipo.equipo != null) {
                await rondaEquipo.loadInfo();
            }

            rondaEquipo.set_onInput(actualizarInfo);
            preparar_calculo_bolas();
        });
    </script>
    <script>
        function addMin(add){
            console.log(`AddMin(${add})`)
            let elem = document.getElementById('p_tiempo');
            elem.value = Number(elem.value) + 60000;
            if (add) {
                elem.value = Number(elem.value) + 60000;
            } else {
                elem.value = Number(elem.value) + 60000;
            }
        }
    </script>

<body>
    <h1>Ficha de Carga</h1>
    <form action="/vuelo" target="/crl/vuelo.html" method="post">
        <p>
            <label for="Ronda">Ronda: </label><select name="Ronda" id="ronda" required></select>
        </p>
        <p>
            <label for="Equipo">Equipo: </label><select name="Equipo" id="equipo" required></select>
        </p>
        <hr>
        <h3>Predicción de Vuelo:</h3>
        <p>
            <input type="number" name="P_tiempo" id="p_tiempo" step="1000" value="0" min="0" required>
            <label for="P_tiempo">Milisegundos (ms)</label>
        </p>
        <p>
            <button id="addMin" onclick="{
                let elem = document.getElementById('p_tiempo');
                elem.value = Number(elem.value) + 60000;
                }">
                añadir Minuto
            </button>
            <button id="subMin" onclick="{
                let elem = document.getElementById('p_tiempo');
                elem.value = Number(elem.value) - 60000;
                }">
                quitar Minuto
            </button>
        </p>
        <hr>
        <h3>Predicción de Peso:</h3>
        <p>
            <input type="number" name="P_peso" id="p_peso" required>
            <label for="P_peso">Gramos (g)</label>
        </p>
        <hr>
        <h3>Carga</h3>
        <p>
            <label for="Peso">Peso:</label><input type="number" name="Peso" id="peso" readonly>
        </p>
        <p>
            <label for="Volumen">Volumen:</label><input type="number" name="Volumen" id="volumen" readonly>
        </p>
        <p>
            <label for="Billar">Numero de Bolas de Billar:</label><input type="number" name="Billar" id="billar" min="0" required>
        </p>
        <p>
            <label for="Ping">Numero de Pelotas de Ping-Pong:</label><input type="number" name="Ping" id="ping" min="0" required>
        </p>
        <hr>
        <h3>Despegue:</h3>
        <p>
            <label for="D_despegue">Menos de 15m:</label>
            <input type="radio" name="D_despegue" id="d_despegue_t" value="true">
        </p>
        <p>
            <label for="D_despegue">Menos de 60m:</label>
            <input type="radio" name="D_despegue" id="d_despegue_f" value="false">
        </p>
        <hr>
        <h3>Piloto Externo:</h3>
        <p>
            <label for="Piloto">Propio:</label>
            <input type="radio" name="Piloto" id="piloto_t" value="true">
        </p>
        <p>
            <label for="Piloto">Externo:</label>
            <input type="radio" name="Piloto" id="piloto_f" value="false">
        </p>
        <hr>
        <h3>Repuestos:</h3>
        <p>
            <label for="Repuestos">Declarados:</label>
            <input type="radio" name="Repuestos" id="repuestos_t" value="true">
        </p>
        <p>
            <label for="Repuestos">No declarados:</label>
            <input type="radio" name="Repuestos" id="repuestos_f" value="false">
        </p>
        <input type="submit" value="Enviar">
    </form>
</body>
</html>
