<body>
    <h2>Control anuncios</h2>
    <input id="input_anuncio" type="text" placeholder="Anuncio">
    <button id="updateText_id" onclick="updateText()">Actualizar texto</button>
    <button id="emptyText_id" onclick="updateText(true)">Vaciar texto</button>
    <button id="dinamicaAnuncio_id" onclick="dinamicaAnuncio()">Esconder anuncio</button>

    <script>
        const socket = io();
        // Coger botones y visibilidad
        let dinamicaAnuncioBot = document.querySelector("#dinamicaAnuncio_id");
        let anuncio_visible = true;

        function updateText(vaciar = false) {
            console.log("Actualizar texto!");
            // Actualiza el texto
            let mensaje = vaciar ? "XTRACHALLENGE 2024" : document.querySelector("#input_anuncio").value;
            socket.emit("all", "anuncio", ["updateText", mensaje]);
        }

        function dinamicaAnuncio() {
            console.log("Dinamica anuncio");

            // Cambiamos el valor del boton
            dinamicaAnuncioBot.textContent = anuncio_visible ? "Mostrar anuncio" : "Esconder anuncio";
    
            // Invertimos el estado de visibilidad
            anuncio_visible = !anuncio_visible;

            socket.emit("all", "anuncio", ["dinamicaAnuncio", anuncio_visible]);
        }
    </script>
</body>
