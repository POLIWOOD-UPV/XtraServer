<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Control de Anuncios - XC25</title>
  <style>
    textarea { 
        width: 100%; 
        height: 20px; 
    }
    button { 
        margin-top: 10px; 
        padding: 1px; 
    }
  </style>
</head>
<body>
  <h1>Panel de control</h1>
  <div>
    <h2>Anuncios para XC25</h1>
    
    <label for="texto">Texto del anuncio:</label><br>
    <textarea id="texto" placeholder="XC2025"></textarea><br>
    
    <button onclick="publicarAnuncio()">Publicar anuncio</button>
    
    <div id="estado"></div>
  </div>
  <div>
    <h2>Equipo mostrado</h2>
    <select id="selector_equipo_img">
      <option value = "">Cargando equipos</option>
    </select>
    <img id="imagen_equipo" src="" alt="Imagen del equipo" style="max-width: 400px; display: none;">
    <button onclick="publicarEquipoMostrado()">Publicar equipo mostrado</button>
    <div id="estadoLogo"></div>
    <div id="datosEquipo"></div>

  </div>
    
  <script src =  "../js/control.js"></script>
</body>
</html>
