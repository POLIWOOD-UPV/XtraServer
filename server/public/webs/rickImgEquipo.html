<!DOCTYPE html>
<html lang="es" xmlns:mso="urn:schemas-microsoft-com:office:office" xmlns:msdt="uuid:C2F41010-65B3-11d1-A29F-00AA00C14882">
<head>
    <meta charset="UTF-8">
    <title></title>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>
    <img id="contenedor_logo_equipo"></img>
    <div id = "estadoLogo"></div>
<script>
    const socket = io();
    // DOM - HTML
    contenedor_logo_equipo = document.querySelector("#contenedor_logo_equipo");
    estadoLogo = document.getElementById("estadoLogo")
    path = ""
    function cogerLogo() {
        fetch("http://localhost/v2/entities?type=Logo")
            .then(res => {
                if (!res.ok) throw new Error("No se pudo obtener la entidad Logo del servidor");
                return res.json();
            })
            .then(json => {
                path = json[0].path.value
                mostrarLogo(path);
            })
            .catch(err => {
                console.error("Error al recibir anuncio:", err);
            });
    }
    function mostrarLogo(path) {
        estadoLogo.textContent = path
        contenedor_logo_equipo.src = path;
    }
    document.addEventListener("DOMContentLoaded", function () {
        // Cogemos el logo inicial
        cogerLogo()
        socket.addEventListener("message", (event) =>{
           if (event == "!entityUpdate urn:ngsi-ld:Logo:001"){
            cogerLogo()
            }       
        });
    })
</script>

</body>
</html>
