<!DOCTYPE html>
<html lang="es" xmlns:mso="urn:schemas-microsoft-com:office:office" xmlns:msdt="uuid:C2F41010-65B3-11d1-A29F-00AA00C14882">
<head>
    <meta charset="UTF-8">
    <title></title>
    <link href="../css/anuncios.css" rel="stylesheet">
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>
    <div id="contenedor_anuncios">
        <div id="anunciero">
            XTRACHALLENGE 2025 - SIN CONEXION AL SERVER
        </div>
    </div>

<script src="../js/anuncio.js"></script>
<script>
    window.addEventListener("message", (event) => {
    const contenedor = document.getElementById("contenedor_anuncios");
    if (!contenedor) return;

    if (event.data === "ocultarAnuncios") {
        contenedor.style.top = "-200px";
    }

    if (event.data === "mostrarAnuncios") {
        contenedor.style.top = "0px";
    }
    });
</script>


</body>
</html>
