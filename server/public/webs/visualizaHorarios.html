<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Prueba de coger equipos</title>
</head>
<style>
    div {
        padding: 5px;
    }
</style>
<body>
  <h1>Visualizador de Tareas</h1>
  <form id="tareas-form" method="GET">


    <div>
        <label for="selector">Selecciona un staff:</label>
        <select id="selector" name="staff_selector">
            <option value="">Cargando equipos...</option>
        </select>
        <br><br>

        <label for="selector_dia">Selecciona un día:</label>
        <select id="selector_dia" name="dia_selector">
            <option value="">Cargando dias...</option>
        </select>
    </div>
    <button type="submit">Ver detalles</button>
  </form>

  <h2>Resultado:</h2>
  <div id="resultado" class="resultado-tareas"></div>
  
  <script src="../js/visualizaHorarios.js"></script>
  </body>
</html>
