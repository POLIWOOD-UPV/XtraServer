<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Prueba de coger equipos</title>
</head>
<style>
    div {
        padding: 5px;
    }
</style>
<body>
  <h1>Visualizador de Equipos</h1>
  <form id="equipo-form" method="GET">
    <div>
        <label for="selector">Selecciona un equipo:</label>
        <select id="selector" name="equipo">
            <option value="">Cargando equipos...</option>
        </select>
    </div>
    <div>
        <label>
            <input type="checkbox" id="abrir"> Abrir en nueva pestaña
        </label>
    </div>
    <button type="submit">Ver detalles</button>
  </form>

  <h2>Resultado:</h2>
  <pre id="resultado">Selecciona un equipo para ver sus datos aquí...</pre>

  <script src="../js/visualizaEquipos.js">  </script>
</body>
</html>
