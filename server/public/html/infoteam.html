<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Info Extra Equipo</title>
        <link rel="stylesheet" href="../css/infoteam.css">
    </head>
    <body>
        <!-- Bloque principal info extra -->
        <div class="bloque_info_extra">
            Extra information of the team:

            <!-- Bloque de nombre + acrónimo -->
            <div id="origen_equipo">
                Saka TUDa (SAKA)
            </div>

            <!-- Bloque de club/universidad + logo -->
            <div id="club_equipo">
                <img src="../img/SAKA.png"
                    alt="Logo of the team"
                    style="height: 22px; object-fit: contain; margin-right: 0px;">
                TUD
            </div>

            <!-- Bloque de miembros del equipo -->
            <div id="miembros_equipo">
                <div id="miembros_label">Members:</div>
                <div id="miembros_resultado">7</div>
            </div>

            <!-- Bloque de líder -->
            <div id="lider_equipo">
                <div id="lider_label">Leader:</div>
                <div id="lider_resultado">Rohan Botta</div>
            </div>

            <!-- Bloque de piloto -->
            <div id="piloto_equipo">
                <div id="piloto_label">Pilot:</div>
                <div id="piloto_resultado">Andrés Sebastián Moreno Moran</div>
            </div>

        </div>
    </body>
</html>
