<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Info Extra Equipo</title>
        <link rel="stylesheet" href="../css/infoteam.css">
    </head>
    <body>
        <!-- Bloque principal info extra -->
        <div class="bloque_info_extra">

            <!-- Bloque de nombre + acrónimo -->
            <div id="origen_equipo">
                <div class="nombre_equipo">Saka TUDa (SAKA)</div> 
                <div class="logo_equipo"><img  src="logo_eolorc.jpg" alt="Logo del equipo" style="height: 22px; width: 22px; "></div>
            </div>

            <div id="dorsal_equipo">
                <div id="dorsal_label">Dorsal:</div>
                <div id="dorsal_number">1</div>
            </div>


            <!-- Bloque de miembros del equipo -->
            <div id="miembros_equipo">
                <div id="miembros_label">Miembros:</div>
                <div id="miembros_resultado">7</div>
            </div>

            <!-- Bloque de líder -->
            <div id="lider_equipo">
                <div id="lider_label">Líder:</div>
                <div id="lider_resultado">Rohan Botta</div>
            </div>

            <!-- Bloque de piloto -->
            <div id="piloto_equipo">
                <div id="piloto_label">Piloto:</div>
                <div id="piloto_resultado">Andrés Sebastián Moreno Moran</div>
            </div>

        </div>
    </body>
</html>
