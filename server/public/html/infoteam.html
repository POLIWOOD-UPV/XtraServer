<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Info Extra Equipo</title>
        <link rel="stylesheet" href="../css/infoteam.css">
    </head>
    <body>
        <div class="bloque_info_extra" id="bloque_info_extra">
            <span class="etiqueta">Team info</span>

            <!-- Cabecera: nombre + acrónimo + logo -->
            <div class="cabecera">
                <div class="titulo">
                    <span id="nombre_equipo">—</span>
                    <span class="acr" id="acr_equipo"></span>
                </div>
                <img class="logo_equipo" id="logo_equipo" src="../img/dummy.png" alt="Logo del equipo">
            </div>

            <!-- Universidad / club -->
            <div class="uni" id="uni_equipo"></div>

            <!-- Métricas -->
            <div class="grid">
                <div class="metrica">
                    <span class="label">Members</span>
                    <span class="valor" id="miembros_resultado">—</span>
                </div>
                <div class="metrica">
                    <span class="label">Payload</span>
                    <span class="valor" id="payload_resultado">—</span>
                </div>
                <div class="metrica ancho">
                    <span class="label">Leader</span>
                    <span class="valor" id="lider_resultado">—</span>
                </div>
                <div class="metrica ancho">
                    <span class="label">Pilot</span>
                    <span class="valor" id="piloto_resultado">—</span>
                </div>
            </div>
        </div>
    </body>
    <script src="/socket.io/socket.io.js"></script>
    <script src="../js/infoteam.js"></script>
</html>
