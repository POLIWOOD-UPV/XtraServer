<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Info Extra Equipo</title>
        <link rel="stylesheet" href="../css/infoteam.css">
    </head>
    <body>
        <!-- Bloque principal info extra -->
        <div class="bloque_info_extra">
            Información Extra del Equipo:
            <!-- Bloque de origen (ciudad/país + bandera) -->
            <div id="origen_equipo"> 
                <!-- enlace a la bandera de la bandera del pais o ciudad -->
                <img src="https://flagcdn.com/w40/es.png"  
                     alt="Bandera del país/ciudad" 
                     style="height: 18px; object-fit: contain; margin-right: 0px;">
                Valencia, España
            </div>

            <!-- Bloque de club/universidad + escudo -->
            <div id="club_equipo">
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/a/a7/Camponotus_flavomarginatus_ant.jpg/40px-Camponotus_flavomarginatus_ant.jpg" 
                     alt="Escudo del club" 
                     style="height: 22px; object-fit: contain; margin-right: 0px;">
                Universidad / Club 
            </div>

            <!-- Bloque de miembros del equipo -->
             <div id="miembros_equipo">
                <div id="miembros_label">Miembros:</div>
                <div id="miembros_resultado">18</div>
            </div>

            <!-- Bloque de victorias en la competición -->
            <div id="victorias_equipo">
                <div id="victorias_label">Campeones:</div>
                <div id="victorias_resultado">Sí</div>
                <div id="victorias_anos">2021, 2023</div>
            </div>

        </div>
    </body>
</html>
