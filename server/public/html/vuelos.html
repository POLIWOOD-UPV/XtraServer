<!DOCTYPE html>
<html lang="es" 
        xmlns:mso="urn:schemas-microsoft-com:office:office" 
        xmlns:msdt="uuid:C2F41010-65B3-11d1-A29F-00AA00C14882">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Team in flight</title>
        <link rel="stylesheet" href="../css/vuelos.css">
</head>
    <body>
        <!-- Bloque principal -->
        <div id="main_block">

            <!-- Cabecera de vuelos-->
            <div id="header_block">
                <div id="team_name" class="content">
                    TEAM DEVS
                </div>

                <div id="team_logo">
                    <img src="https://img.game8.co/3642210/daaaa1c27a3ad015412368150d5f712a.png/thumb"
                        alt="Es Marzo tío"
                        style="width: 100%; height: 100%; object-fit: contain;">
                </div>
            </div>

            <!-- Información de vuelos-->
            <div id="info_block">
                <div id="team_bulk" class="content">
                    Devs lleva agua?
                </div>

                <div id="team_points" class="content">
                    SCORE: El máximo obvio
                </div>

                <div id="extra_info" class="content">
                    Estoy aprendiendo más aquí que en cualquier carrera
                </div>
            </div>

            <!-- Botón muy guay-->
            <button id="up_down_button" class="content"></button>

            </div>
        
        <script src="../js/vuelos.js"></script>

    </body>
</html>
