<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mejores puntuaciones</title>
    <link rel="stylesheet" href="../css/mejores.css">
</head>
<body>
    <div id="contenedor-mejores">
        <table class="tabla-mejores">
            <thead>
                <tr>
                    <th>Best</th>
                    <th>Value</th>
                    <th>Name</th>
                </tr>
            </thead>
            <tbody>
                <tr id="fila-tiempo">
                    <td>Time</td>
                    <td id="valor-mejor-tiempo">X</td>
                    <td id="equipo-mejor-tiempo">Team</td>
                </tr>
                <tr id="fila-carga">
                    <td>Load</td>
                    <td id="valor-mejor-carga">X</td>
                    <td id="equipo-mejor-carga">Team</td>
                </tr>
            </tbody>
        </table>
    </div>
</body>

</html>
