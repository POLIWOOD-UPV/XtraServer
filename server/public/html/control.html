<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Control</title>
        <link rel="stylesheet" href="../css/control.css" />
        <script src="/socket.io/socket.io.js" defer></script>
        <script src="../js/api.js" defer></script>
        <script src="../js/control.js" defer></script>
    </head>
    <body>
        <h1>Control XtraChallenge</h1>

        <section>
            <h2>Control de Animaciones</h2>
            <div class="fila">
                <button class="btnToggle" data-attr="anuncios">Anuncios</button>
                <button class="btnToggle" data-attr="sponsors">Sponsors</button>
                <button class="btnToggle" data-attr="infoteam">InfoTeam</button>
                <button class="btnToggle" data-attr="siguiente">Siguiente</button>
                <button class="btnToggle" data-attr="clima">Clima</button>
                <button class="btnToggle" data-attr="puntos">Puntos</button>
            </div>
            <div class="fila">
                <button id="btnRecargarPuntos">Recargar puntos</button>
            </div>
            <p class="feedback" id="feedbackPuntos"></p>
        </section>

        <section>
            <h2>Texto del anuncio</h2>
            <div class="fila">
                <input type="text" id="inputTexto" placeholder="Texto del anuncio..." />
                <button id="btnEnviarTexto">Enviar</button>
            </div>
            <p class="feedback" id="feedbackTexto"></p>
        </section>

        <section>
            <h2>Equipo mostrado (Volando)</h2>
            <div class="fila">
                <select id="selectEquipo">
                    <option value="">Ninguno</option>
                </select>
                <button id="btnEnviarEquipo">Enviar</button>
            </div>
            <p class="feedback" id="feedbackEquipo"></p>

            <div class="fila">
                <input type="number" id="inputPayload" min="0" step="1" placeholder="Payload (PL)..." />
                <button id="btnEnviarPayload">Enviar payload</button>
            </div>
            <p class="feedback" id="feedbackPayload"></p>
        </section>

        <section>
            <h2>Siguiente equipo (Next)</h2>
            <div class="fila">
                <select id="selectSiguiente">
                    <option value="">Ninguno</option>
                </select>
                <button id="btnEnviarSiguiente">Enviar</button>
            </div>
            <p class="feedback" id="feedbackSiguiente"></p>
        </section>
    </body>
</html>
