<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prueba Estatica</title>
    <script>
        var response;
        var equipos;
        var rondas;
        var carga;
        addEventListener("DOMContentLoaded", async () => {
            response = (await fetch("/data/equipos.json", {method:"GET"}));
            equipos = await response.json();
            response = (await fetch("/data/rondas.json", {method:"GET"}));
            rondas = await response.json();
            response = (await fetch("/data/carga.json", {method:"GET"}));
            carga = await response.json();

            var select_ronda = document.querySelector("#ronda");
            var select_equipo = document.querySelector("#equipo");

            rondas.forEach(element => {
                let option = document.createElement("option");
                option.innerText = element;
                option.value = element;
                select_ronda.appendChild(option);
            });

            equipos.forEach(element => {
                let option = document.createElement("option");
                option.innerText = element.Team;
                option.value = element.Team;
                select_equipo.appendChild(option);
            });
        });
    </script>
</head>
<body>
    <h1>Prueba Estatica</h1>
    <form action="/estat" method="post">
        <p>
            <label for="Ronda">Ronda: </label><select name="Ronda" id="ronda"></select>
        </p>
        <p>
            <label for="Equipo">Equipo: </label><select name="Equipo" id="equipo"></select>
        </p>
        <hr>
        <h3>Predicción:</h3>
        <p>
            <label for="P_tiempo">Tiempo: </label><input type="time" name="P_tiempo" id="p_tiempo">
        </p>
        <p>
            <label for="P_peso">Peso: </label><input type="number" name="P_peso" id="p_peso" readonly>
        </p>
        <p>
            <label for="P_volumen">Volumen: </label><input type="number" name="P_volumen" id="p_volumen" readonly>
        </p>
        <p>
            <label for="P_billar">Numero de Bolas de Billar: </label><input type="number" name="P_billar" id="p_billar">
        </p>
        <p>
            <label for="P_ping">Numero de Pelotas de Ping-Pong: </label><input type="number" name="P_ping" id="p_ping">
        </p>
        <hr>
        <h3>Tiempo de carga:</h3>
        <p>
            <input type="time" name="T_carga" id="t_carga">
        </p>
        <hr>
        <h3>Resultante:</h3>
        <p>
            <label for="Peso">Peso:</label><input type="number" name="Peso" id="peso" readonly>
        </p>
        <p>
            <label for="Volumen">Volumen:</label><input type="number" name="Volumen" id="volumen" readonly>
        </p>
        <p>
            <label for="billar">Numero de Bolas de Billar:</label><input type="number" name="billar" id="billar">
        </p>
        <p>
            <label for="ping">Numero de Pelotas de Ping-Pong:</label><input type="number" name="ping" id="ping">
        </p>
        <hr>
        <h3>Piloto Externo:</h3>
        <p>
            <input type="checkbox" name="Piloto" id="piloto">
        </p>
        <hr>
        <input type="submit" value="Enviar">
    </form>
</body>
</html>
