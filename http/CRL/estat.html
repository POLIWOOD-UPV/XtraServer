<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prueba Estatica</title>
    <script>
        var response;
        var equipos;
        var rondas;
        var conversion;
        var info;
    </script>
    <script src="./js/rondaJSON.js"></script>
    <script>
        const cargar_json = () => {
            var select_ronda = document.querySelector("#ronda");
            var select_equipo = document.querySelector("#equipo");

            rondas.forEach(element => {
                let option = document.createElement("option");
                option.innerText = element;
                option.value = element;
                select_ronda.appendChild(option);
            });

            equipos.forEach(element => {
                let option = document.createElement("option");
                option.innerText = element.Team;
                option.value = element.Team;
                select_equipo.appendChild(option);
            });

            select_ronda.addEventListener("onchange", () => {
                ronda = select_ronda.value;
                if (ronda != null && equipo != null) {
                    loadInfo(ronda, equipo);
                    actualizarInfo();
                }
            });

            select_equipo.addEventListener("onchange", () => {
                equipo = select_equipo.value;
                if (ronda != null && equipo != null) {
                    loadInfo(ronda, equipo);
                    actualizarInfo();
                }
            });
        };

        const preparar_calculo_bolas = () => {
            var input_billar = document.querySelector("#billar");
            var input_ping = document.querySelector("#ping");
            var input_peso = document.querySelector("#peso");
            var input_volumen = document.querySelector("#volumen");

            input_billar.addEventListener("input", () => {
                input_peso.value = input_billar.value * conversion.billar.peso
                                + input_ping.value * conversion.ping.peso;
                input_volumen.value = input_billar.value * conversion.billar.volumen
                                + input_ping.value * conversion.ping.volumen;
            });

            input_ping.addEventListener("input", () => {
                input_peso.value = input_billar.value * conversion.billar.peso
                                + input_ping.value * conversion.ping.peso;
                input_volumen.value = input_billar.value * conversion.billar.volumen
                                + input_ping.value * conversion.ping.volumen;
            });

            var input_billar = document.querySelector("#p_billar");
            var input_ping = document.querySelector("#p_ping");
            var input_peso = document.querySelector("#p_peso");
            var input_volumen = document.querySelector("#p_volumen");

            input_billar.addEventListener("input", () => {
                input_peso.value = input_billar.value * conversion.billar.peso
                                + input_ping.value * conversion.ping.peso;
                input_volumen.value = input_billar.value * conversion.billar.volumen
                                + input_ping.value * conversion.ping.volumen;
            });

            input_ping.addEventListener("input", () => {
                input_peso.value = input_billar.value * conversion.billar.peso
                                + input_ping.value * conversion.ping.peso;
                input_volumen.value = input_billar.value * conversion.billar.volumen
                                + input_ping.value * conversion.ping.volumen;
            });
        };

        const actualizarInfo = () => {
            if (ronda == null || equipo == null) {
                return;
            }

            if (info == null) {
                return;
            }

            for (const key in info) {
                if (Object.hasOwnProperty.call(info, key)) {
                    let element = document.getElementById(key.toLowerCase())
                    if (element == null) {
                        continue;
                    }
                    element.value = info[key];
                }
            }
        };

        addEventListener("DOMContentLoaded", async () => {
            await loadJSON();
            if (ronda != null && equipo != null) {
                await loadInfo(ronda, equipo);
            }
            cargar_json();
            preparar_calculo_bolas();
        });
    </script>
</head>
<body>
    <h1>Prueba Estatica</h1>
    <form action="/vuelo" target="/crl/vuelo.html" method="post">
        <p>
            <label for="Ronda">Ronda: </label><select name="Ronda" id="ronda"></select>
        </p>
        <p>
            <label for="Equipo">Equipo: </label><select name="Equipo" id="equipo"></select>
        </p>
        <hr>
        <h3>Predicción:</h3>
        <p>
            <label for="P_tiempo">Tiempo: </label><input type="time" name="P_tiempo" id="p_tiempo">
        </p>
        <p>
            <label for="P_peso">Peso: </label><input type="number" name="P_peso" id="p_peso" readonly>
        </p>
        <p>
            <label for="P_volumen">Volumen: </label><input type="number" name="P_volumen" id="p_volumen" readonly>
        </p>
        <p>
            <label for="P_billar">Numero de Bolas de Billar: </label><input type="number" name="P_billar" id="p_billar">
        </p>
        <p>
            <label for="P_ping">Numero de Pelotas de Ping-Pong: </label><input type="number" name="P_ping" id="p_ping">
        </p>
        <hr>
        <h3>Tiempo de carga:</h3>
        <p>
            <input type="time" name="T_carga" id="t_carga">
        </p>
        <hr>
        <h3>Resultante:</h3>
        <p>
            <label for="Peso">Peso:</label><input type="number" name="Peso" id="peso" readonly>
        </p>
        <p>
            <label for="Volumen">Volumen:</label><input type="number" name="Volumen" id="volumen" readonly>
        </p>
        <p>
            <label for="Billar">Numero de Bolas de Billar:</label><input type="number" name="Billar" id="billar">
        </p>
        <p>
            <label for="Ping">Numero de Pelotas de Ping-Pong:</label><input type="number" name="Ping" id="ping">
        </p>
        <hr>
        <h3>Piloto Externo:</h3>
        <p>
            <input type="checkbox" name="Piloto" id="piloto">
        </p>
        <hr>
        <input type="submit" value="Enviar">
    </form>
</body>
</html>
