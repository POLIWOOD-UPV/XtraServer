<!DOCTYPE html>
<link rel = "stylesheet" href="../hud/css/ranking.css"></link>
<html lang="es">
    <main>
        <!--Controles, en un futuro irían en la página de controles-->
        <div id = "divBotones">
            <div id = "divBotonesRanking">
                <h2>Control Ranking</h2>
                <button onclick = "s_rankingMov()" id = "aparecer_desaparecer_rank_id">Ocultar ranking</button>
                <button onclick = "s_aparicionDinamica()">Aparicion dinamica</button>
                <button onclick = "s_desaparicionDinamica()">Desaparicion Dinamica</button>

                <h3>Informativos</h3>
                <button onclick= "s_mostrarTiempo()" id = "mostrar_tiempo_id">Ocultar Tiempos</button>
                <button onclick= "s_mostrarPeso()" id = "mostrar_peso_id">Mostrar Peso</button>
                <button onclick = "s_cambiazoPesoTiempos()" id = "cambiazoPesoTiempos"> Alternar Peso / Tiempo</button>
            </div>
        </div>    
            <div id = "divIntegraPilotos">
                <h2>Integracion de pilotos</h2>
                    

                <h3>Sumar</h3>
                    <select name="nombres_equipos_constructor" id="nombres_equipos_constructor_id">
                        <option value="RUHE">RUHE</option>
                        <option value="Aerotech">Aerotech</option>
                        <option value="G3">G3</option>
                        <option value="Matsia">Matsia</option>
                        <option value="LuftSieger">LuftSieger</option>
                        <option value="ECLift">ECLift</option>
                        <option value="SAETA_T2">SAETA_T2</option>
                        <option value="DIANA">DIANA</option>
                        <option value="Trencalòs">Trencalòs</option>
                        <option value="North Pole">North Pole</option>
                        <option value="SAETA_T1">SAETA_T1</option>
                        <option value="UCA&Air">UCA&Air</option>
                        <option value="Club Xaloc">Club Xaloc</option>
                        <option value="Sky Eagle">Sky Eagle</option>
                    </select>
                    <input class = "inputs" id = "minutos_input_id" type="text" placeholder="Minutos" required>
                    <input class = "inputs" id = "segundos_input_id" type="text" placeholder="Segundos" required>
                    <input class = "inputs" id = "milisegundos_input_id" type="text" placeholder="Milisegundos" required>
                    <input class = "inputs" id = "peso_input_id" type="text" placeholder="Peso" required>
                    <button onclick="s_sumaPiloto('animado')">SUMAR_An</button>
                    <button onclick="s_sumaPiloto('seco')"> SUMAR</button>

                <h3>Borrar</h3>
                <div id = "pilotos_mas_borrar">
                    <div class = "fila_control_borrar">
                        <div class = "nombre_control">RIC</div>
                        <button class = "boton_control" id = "1c_AN" onclick="quitaPiloto('animado',this.id)">BORRAR_An</button>
                        <button class = "boton_control"  id = "1c" onclick="quitaPiloto('seco',this.id)"> BORRAR</button>
                        <div class = "tiempo_control">33:33:333</div>
                    </div>
                </div>
                <button onclick="s_vaciarPilotos()"> VACIAR PILOTOS</button>
                <button onclick="hola()"> Hola!</button>
            </div>     
        <details>
            <summary>
                TODO:
            </summary>
            <ul>
                <li>Hacer animaciones para el peso / tiempo</li>
                <li>Calcular la diferencia de tiempos entre filas</li>
                <li>Optimizar botones de arriba de aparicon / desaparicion</li>
            </ul>
        </details>
    </main>
    <script src="/socket.io/socket.io.js"></script>
    <script>
        // Elementos HTML
        var pilotos_control_resta = document.getElementById("pilotos_mas_borrar") // Bloque de las filas control borrar
        var filas_control = document.getElementsByClassName("fila_control_borrar") // Filas del bloque control borrar
        var botones_control = document.getElementsByClassName("boton_control")
        var aparecer_desaparecer_rank = document.getElementById("aparecer_desaparecer_rank_id")

        // Cogemos los botones
        var boton_tiempo = document.getElementById("mostrar_tiempo_id");
        var boton_peso = document.getElementById("mostrar_peso_id");
        var boton_cambiazo = document.getElementById("cambiazoPesoTiempos")

        // Flags
        let peso_visible = false;
        let tiempo_visible = true;
        var ranking_visible = true;
        var filas_visible = true;

        var pilotos = ["RIC"]

        // Inicializamos el socket
        const socket = io();
        
        function hola(){
            socket.emit("all","message","Hola!");
        }

        // Filas
        function s_mostrarTiempo(){
            if (tiempo_visible){
                // Ocultar tiempos
                boton_tiempo.textContent = "Mostrar Tiempos"
                tiempo_visible = false;
            }else{
                // Mostrar tiempos
                boton_tiempo.textContent = "Ocultar Tiempos"
                tiempo_visible = true;
            }
            socket.emit("all","mosTmpo");
        }

        function s_mostrarPeso(){
            if (peso_visible){
                // Ocultar pesos
                boton_peso.textContent = "Mostrar Pesos"
                peso_visible = false;
            }else{
                // Mostrar pesos
                boton_peso.textContent = "Ocultar Pesos"
                peso_visible = true;
            }
            socket.emit("all","mosPeso");
        }

        function s_cambiazoPesoTiempos(){
            if ((!tiempo_visible && !peso_visible) ||(tiempo_visible && peso_visible) ) {
                return
            }else{
                s_mostrarTiempo();
                s_mostrarPeso();
            }
        }

        // Pilotos
        function s_vaciarPilotos(){
            for (let j = filas_control.length-1; j>=0; j--){
                console.log(filas_control[j])
                filas_control[j].remove(); // Quitar todas las filas de control                    
            }
            socket.emit("all","vacPilo");
        }
        function s_sumaPiloto(estado){
            // Agreganis el avion a la lista y lo cogemos
            piloto = crea_Perfil();

            // Coger el tiempo del avion
            minutos = cogerTiempo_Peso("min")
            segundos = cogerTiempo_Peso("seg")
            miliseg = cogerTiempo_Peso("mil")
            tiempo = minutos + ":" + segundos + ":" + miliseg
            // Coger el peso
            peso = cogerTiempo_Peso("pes")
            // Encontrar en que posicion va a estar AHORA A TRAVES DE CONTROL!!!!!
            pos = sacar_pos_avion(tiempo) // Es un numero
            FilaControlResta(piloto,tiempo,pos) // Lo llamo antes para que cree la fila con id 1, o sino se la saltaba
    
            info = [piloto, pos, tiempo, peso, estado]
            socket.emit("all", "sumPil",info );

        }
        // Dinamicas
        function s_rankingMov(){
            if (ranking_visible) { // Es visible
                // Ranking se pasa a oculto
                aparecer_desaparecer_rank.textContent = "Aparecer Ranking";
                ranking_visible = false;
            } else { // No es visible
                aparecer_desaparecer_rank.textContent = "Desaparecer Ranking";
                ranking_visible = true;
                }
            socket.emit("all","rankMov");
        }

        function s_aparicionDinamica(){
            socket.emit("all","apaDina")
        }
        function s_desaparicionDinamica(){
            socket.emit("all","desDina")
        }
    
        // Funciones traidas de otros archivos

        // Coge al piloto y lo mete en el sistema
        function crea_Perfil() {
            // Cogemos el  del avion actual a través del drop down
            let piloto_input = document.getElementById("nombres_equipos_constructor_id")
            piloto = piloto_input.value
            // Metemos el nuevo perfil en la lista
            pilotos.push(piloto)
            return piloto
        }

        // Coger los tiempos del input
        function cogerTiempo_Peso(que) {
            switch (que) {
                case "min":
                    // Coger Minutos
                    minutos = document.getElementById("minutos_input_id").value;
                    return validarNumero(minutos) ? parseInt(minutos) : 0;

                case "seg":
                    // Coger segundos
                    segundos = document.getElementById("segundos_input_id").value;
                    return validarNumero(segundos) ? parseInt(segundos) : 0;

                case "mil":
                    // Coger milis
                    milis = document.getElementById("milisegundos_input_id").value;
                    return validarNumero(milis) ? parseInt(milis) : 0;
                case "pes":
                    // Coger el peso
                    peso = document.getElementById("peso_input_id").value
                    return validarNumero(milis) ? parseInt(milis) : 0+" Kg";
            }
        }

                
        function FilaControlResta(piloto,tiempo,pos){
            // Creamos la fila con sus partes
            let fila_borrar = document.createElement("div")
            fila_borrar.className = "fila_control_borrar"
            
            // Ponemos el nombre
            let nombre = document.createElement("div")
            nombre.textContent = piloto
            fila_borrar.append(nombre)

            // Para borrar
            //Ponemos el boton de eliminar animado
            let botoncin = document.createElement("button")
            botoncin.id = pos+"c_AN" // Le ponemos el id con la posicion en la que esta para luego poder quitarlo al borrar el piloto

            botoncin.onclick = () => {
                quitaPiloto('animado',botoncin.id) // Le pasamos la ID ya que es lo que lleva en que pos estamos 
            };
            botoncin.textContent = "BORRAR_An"
            botoncin.className = "boton_control"
            fila_borrar.append(botoncin)

            //Ponemos el boton de eliminar seco
            let botoncin2 = document.createElement("button")
            botoncin2.id = pos+"c" // Le ponemos el id con la posicion en la que esta para luego poder quitarlo al borrar el piloto

            botoncin2.onclick = () => {
                quitaPiloto('seco',botoncin2.id); // Le pasamos la ID ya que es lo que lleva en que pos estamos 
            };
            botoncin2.textContent = "BORRAR"
            botoncin2.className = "boton_control"
            fila_borrar.append(botoncin2)


            // Ponemos el tiempo del piloto
            let tiempin = document.createElement("div")
            tiempin.className = "tiempo_control"
            tiempin.textContent = tiempo
            fila_borrar.append(tiempin)


            //Ponemos la fila en BORRAR al final y luego lo reordenamos todo y nos da igual ya que no se va a ver
            pilotos_control_resta.append(fila_borrar)

            // Lo reordenamo
            arreglar_pos_control(pos)
            console.log("Metido en: "+pos+" "+tiempo)
        }

        // Arregla las posiciones de abajo
        function arreglar_pos_control(pos) {
        // Ordenamos las filas de control
            ordenar_control()
            if (pos < (filas_control.length)) { // Si la posicion se cuela entre y otras 
                // Ordenamos las filas de control
                //ordenar_control()

                // Guardamos los números de las IDs que vamos a poner
                let numeros = [];
                for (let i = filas_control.length - 1; i >= pos; i--){ // Cogemos al revés para que no haya conflictos de IDs
                    numeros.push(i); // La posición como tal
                }
                // Sumamos y reasignamos
                for (let i = 0; i < numeros.length; i++) { // Empezamos en 0 porque vamos a trabajar con indices en listas
                    // Cogemos el id con el que vamos a trabajar
                    let boton_id = numeros[i];
                    
                    // Cogemos los botones antiguos
                    let boton_seco = document.getElementById(String(boton_id + "c")); // Cogemos el botón seco antiguo
                    let boton_anim = document.getElementById(String(boton_id + "c_AN")); // Cogemos el botón animado antiguo

                    // Actualizamos el ID
                    boton_seco.id = String((boton_id + 1) + "c");
                    boton_anim.id = String((boton_id + 1) + "c_AN");
        
                    // Actualizamos el onclick
                    boton_seco.onclick = () => {
                        quitaPiloto('seco',boton_seco.id); // Le pasamos la ID ya que es lo que lleva en que pos estamos 
                    };

                    boton_anim.onclick = () => {
                        quitaPiloto('seco',boton_anim.id); // Le pasamos la ID ya que es lo que lleva en que pos estamos 
                    };

                }    
            }
        }


        function ordenar_control() {
            var tiempos_ord_cont = [];
            // Obtener los tiempos de todas las filas
            Array.from(filas_control).forEach(fila => {
                let tiempo = fila.querySelector(".tiempo_control").textContent;
                let tiempoEnSegundos = convertirTiempoAMilisegundos(tiempo);
                tiempos_ord_cont.push(tiempoEnSegundos);
            });
            // Ordenar los tiempos
            let tiemposOrdenados = [...tiempos_ord_cont].sort((a, b) => a - b);
            // Los tiempos salen bien ordenados

            // Reordenar las filas en base a los tiempos ordenados
            Array.from(filas_control).forEach((fila, index) => {
                let tiempoFila = convertirTiempoAMilisegundos(fila.querySelector(".tiempo_control").textContent);
                let nuevaPosicion = tiemposOrdenados.indexOf(tiempoFila) + 1; // Agregar 1 ya que las posiciones comienzan desde 1
                
                // ESTA LINEA ES UNA BENDICION LA AMO
                fila.style.order = nuevaPosicion; // Establecer el orden con CSS CSS 
            });
            
        }

        // funcion para convertir a milisegundos
        function convertirTiempoAMilisegundos(tiempo) {
            let partes = tiempo.split(':');
            let minutos = Number(partes[0]) * 60;
            let segundos = Number(partes[1]);
            let milisegundos = Number(partes[2]) * 0.001;
            return minutos + segundos + milisegundos;
        }

        // Función para validar si el valor es un número
        function validarNumero(valor) {
            return /^\d+$/.test(valor); // No se como va pero va :)
        }

        //Sacar la nueva posicion  - PERO AHORA DESDE CONTROL LOOOL
        function sacar_pos_avion(tiempo) {
            let tiempo_avion = convertirTiempoAMilisegundos(tiempo);

            let tiempos = [];
            filas_array = Array.from(filas_control);

            // Cogemos todos los tiempos de los aviones
            filas_array.forEach(fila => {
                let tiempo = fila.querySelector('.tiempo_control').textContent;
                let tiempoEnSegundos = convertirTiempoAMilisegundos(tiempo);
                tiempos.push(tiempoEnSegundos);
            });

            // Metemos al final el nuestro y creamos una copia ordenada
            tiempos.push(tiempo_avion);
            let tiempos2 = [...tiempos].sort((a, b) => a - b);

            // Buscamos el indice y +1 ya que es un array y las pos empiezan en 1 no 0
            let nueva_posicion = tiempos2.lastIndexOf(tiempo_avion) + 1;

            return nueva_posicion;
        }

    </script>
</html>
