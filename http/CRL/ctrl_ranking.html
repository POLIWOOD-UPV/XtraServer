<!DOCTYPE html>
<link rel = "stylesheet" href="../hud/css/ranking.css"></link>
<html lang="es">
    <main>
        <!--Controles, en un futuro irían en la página de controles-->
        <div id = "divBotones">
            <div id = "divBotonesRanking">
                <h2>Control Ranking</h2>
                <button onclick = "s_rankingMov()" id = "aparecer_desaparecer_rank_id">Ocultar ranking</button>
                <button onclick = "s_aparicionDinamica()">Aparicion dinamica</button>
                <button onclick = "s_desaparicionDinamica()">Desaparicion Dinamica</button>

                <h3>Informativos</h3>
                <button onclick= "s_mostrarTiempo()" id = "mostrar_tiempo_id">Ocultar Tiempos</button>
                <button onclick= "s_mostrarPeso()" id = "mostrar_peso_id">Mostrar Peso</button>
                <button onclick = "s_cambiazoPesoTiempos()" id = "cambiazoPesoTiempos"> Alternar Peso / Tiempo</button>
            </div>
        </div>    
            <div id = "divIntegraPilotos">
                <h2>Integracion de pilotos</h2>
                    

                <h3>Sumar</h3>
                    <select name="nombres_equipos_constructor" id="nombres_equipos_constructor_id">
                        <option value="RUHE">RUHE</option>
                        <option value="Aerotech">Aerotech</option>

                        <option value="DIANA">DIANA</option>
                        <option value="Trencalòs">Trencalòs</option>
                        <option value="North Pole">North Pole</option>
                        <option value="SAETA_T1">SAETA_T1</option>
                        <option value="UCA&Air">UCA&Air</option>
                        <option value="Club Xaloc">Club Xaloc</option>
                        <option value="Sky Eagle">Sky Eagle</option>
                    </select>
                    <input class = "inputs" id = "minutos_input_id" type="text" placeholder="Minutos" required>
                    <input class = "inputs" id = "segundos_input_id" type="text" placeholder="Segundos" required>
                    <input class = "inputs" id = "milisegundos_input_id" type="text" placeholder="Milisegundos" required>
                    <input class = "inputs" id = "peso_input_id" type="text" placeholder="Peso" required>
                    <button onclick="s_sumaPiloto('animado')">SUMAR_An</button>
                    <button onclick="sumaPiloto('seco')"> SUMAR</button>

                <h3>Borrar</h3>
                <div id = "pilotos_mas_borrar">
                    <div class = "fila_control_borrar">
                        <div class = "nombre_control">RIC</div>
                        <button class = "boton_control" id = "1c_AN" onclick="quitaPiloto('animado',this.id)">BORRAR_An</button>
                        <button class = "boton_control"  id = "1c" onclick="quitaPiloto('seco',this.id)"> BORRAR</button>
                        <div class = "tiempo_control">33:33:333</div>
                    </div>
                </div>
                <button onclick="s_vaciarPilotos()"> VACIAR PILOTOS</button>
                <button onclick="hola()"> Hola!</button>
            </div>     
        <details>
            <summary>
                TODO:
            </summary>
            <ul>
                <li>Hacer animaciones para el peso / tiempo</li>
                <li>Calcular la diferencia de tiempos entre filas</li>
                <li>Optimizar botones de arriba de aparicon / desaparicion</li>
            </ul>
        </details>
    </main>
    <script src="/socket.io/socket.io.js"></script>
    <script>
        // Elementos HTML
        var pilotos_control_resta = document.getElementById("pilotos_mas_borrar") // Bloque de las filas control borrar
        var filas_control = document.getElementsByClassName("fila_control_borrar") // Filas del bloque control borrar
        var botones_control = document.getElementsByClassName("boton_control")
        var aparecer_desaparecer_rank = document.getElementById("aparecer_desaparecer_rank_id")

        // Cogemos los botones
        var boton_tiempo = document.getElementById("mostrar_tiempo_id");
        var boton_peso = document.getElementById("mostrar_peso_id");
        var boton_cambiazo = document.getElementById("cambiazoPesoTiempos")

        // Flags
        let peso_visible = false;
        let tiempo_visible = true;
        var ranking_visible = true;
        var filas_visible = true;

        // Inicializamos el socket
        const socket = io();
        
        // Actualizamos las variables
        socket.on("synchro", (pesoV, tiempoV, rankingV, filasV) => {
            console.log('peso_visible:', pesoV);
            console.log('tiempo_visible:', tiempoV);
            console.log('ranking_visible:', rankingV);
            console.log('filas_visible:', filasV);

            // Asignar los valores recibidos a las variables globales
            peso_visible = pesoV;
            tiempo_visible = tiempoV;
            ranking_visible = rankingV;
            filas_visible = filasV;
        });

        socket.on("mensaje",(test)=>{
            console.log("Caracola "+test)
        })
        function hola(){
            socket.emit("all","message","Hola!");
        }
        // Filas
        function s_mostrarTiempo(){
            if (tiempo_visible){
                // Ocultar tiempos
                boton_tiempo.textContent = "Mostrar Tiempos"
                tiempo_visible = false;
            }else{
                // Mostrar tiempos
                boton_tiempo.textContent = "Ocultar Tiempos"
                tiempo_visible = true;
            }
            socket.emit("all","mosTmpo");
        }

        function s_mostrarPeso(){
            if (peso_visible){
                // Ocultar pesos
                boton_peso.textContent = "Mostrar Pesos"
                peso_visible = false;
            }else{
                // Mostrar pesos
                boton_peso.textContent = "Ocultar Pesos"
                peso_visible = true;
            }
            socket.emit("all","mosPeso");
        }

        function s_cambiazoPesoTiempos(){
            if ((!tiempo_visible && !peso_visible) ||(tiempo_visible && peso_visible) ) {
                return
            }else{
                s_mostrarTiempo();
                s_mostrarPeso();
            }
        }

        // Pilotos
        function s_vaciarPilotos(){
            for (let j = filas_control.length-1; j>=0; j--){
                console.log(filas_control[j])
                filas_control[j].remove(); // Quitar todas las filas de control                    
            }
            socket.emit("all","vacPilo");
        }
        function s_sumaPiloto(estado){
            //codigo
        }
        // Dinamicas
        function s_rankingMov(){
            if (ranking_visible) { // Es visible
                // Ranking se pasa a oculto
                aparecer_desaparecer_rank.textContent = "Aparecer Ranking";
                ranking_visible = false;
            } else { // No es visible
                aparecer_desaparecer_rank.textContent = "Desaparecer Ranking";
                ranking_visible = true;
                }
            socket.emit("all","rankMov");
        }

        function s_aparicionDinamica(){
            socket.emit("all","apaDina")
        }
        function s_desaparicionDinamica(){
            socket.emit("all","desDina")
        }
    </script>

</html>
