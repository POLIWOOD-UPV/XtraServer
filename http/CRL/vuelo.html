<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vuelo</title>
    <script>
        var response;
        var equipos;
        var rondas;
        var conversion;
        var info;
    </script>
    <script src="./js/rondaJSON.js"></script>
    <script>
        const cargar_json = () => {
            var select_ronda = document.querySelector("#ronda");
            var select_equipo = document.querySelector("#equipo");

            rondas.forEach(element => {
                let option = document.createElement("option");
                option.innerText = element;
                option.value = element;
                select_ronda.appendChild(option);
            });

            equipos.forEach(element => {
                let option = document.createElement("option");
                option.innerText = element.Team;
                option.value = element.Team;
                select_equipo.appendChild(option);
            });

            select_ronda.addEventListener("input", async () => {
                ronda = select_ronda.value;
                if (ronda != null && equipo != null) {
                    info = await loadInfo(ronda, equipo);
                    actualizarInfo();
                }
            });

            select_equipo.addEventListener("input", async () => {
                equipo = select_equipo.value;
                if (ronda != null && equipo != null) {
                    info = await loadInfo(ronda, equipo);
                    actualizarInfo();
                }
            });
        };

        const preparar_calculo_bolas = () => {
            var input_billar = document.querySelector("#billar");
            var input_ping = document.querySelector("#ping");
            var input_peso = document.querySelector("#peso");
            var input_volumen = document.querySelector("#volumen");

            input_billar.addEventListener("input", () => {
                input_peso.value = input_billar.value * conversion.billar.peso
                                + input_ping.value * conversion.ping.peso;
                input_volumen.value = input_billar.value * conversion.billar.volumen
                                + input_ping.value * conversion.ping.volumen;
            });

            input_ping.addEventListener("input", () => {
                input_peso.value = input_billar.value * conversion.billar.peso
                                + input_ping.value * conversion.ping.peso;
                input_volumen.value = input_billar.value * conversion.billar.volumen
                                + input_ping.value * conversion.ping.volumen;
            });
        };

        const preparar_checkbox = () => {
            var inputs = document.querySelectorAll("form input['type'='checkbox']");
            inputs.forEach((element) => {
                element.setAttribute("input", () => {
                    self.value = (self.checked)? "on": "";
                });
            });
        }

        addEventListener("DOMContentLoaded", async () => {
            await loadJSON();
            if (ronda != null && equipo != null) {
                await loadInfo(ronda, equipo);
            }
            cargar_json();
            preparar_calculo_bolas();
            preparar_checkbox();
        });
    </script>
</head>
<body>
    <h1>Prueba Dinamica</h1>
    <form action="/vuelo" target="/crl/vuelo.html" method="post">
        <p>
            <label for="Ronda">Ronda: </label><select name="Ronda" id="ronda" required></select>
        </p>
        <p>
            <label for="Equipo">Equipo: </label><select name="Equipo" id="equipo" required></select>
        </p>
        <hr>
        <h3>Tiempo de Vuelo:</h3>
        <p>
            <input type="time" name="T_vuelo" id="t_vuelo">
        </p>
        <hr>
        <h3>Carga</h3>
        <p>
            <label for="Peso">Peso:</label><input type="number" name="Peso" id="peso" readonly>
        </p>
        <p>
            <label for="Volumen">Volumen:</label><input type="number" name="Volumen" id="volumen" readonly>
        </p>
        <p>
            <label for="Billar">Numero de Bolas de Billar:</label><input type="number" name="Billar" id="billar" min="0">
        </p>
        <p>
            <label for="Ping">Numero de Pelotas de Ping-Pong:</label><input type="number" name="Ping" id="ping" min="0">
        </p>
        <hr>
        <h3>Despegue:</h3>
        <p>
            <label for="_15">Menos de 15m:</label>
            <input type="checkbox" name="_15" id="_15">
        </p>
        <p>
            <label for="_60">Menos de 60m:</label>
            <input type="checkbox" name="_60" id="_60">
        </p>
        <hr>
        <h3>Vuelo Nulo:</h3>
        <p>
            <input type="checkbox" name="VN" id="vn">
        </p>
        <h3>Estrellado:</h3>
        <p>
            <input type="checkbox" name="Estrellado" id="estrellado">
        </p>
        <input type="submit" value="Enviar">
    </form>
</body>
</html>
