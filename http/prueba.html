<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>Test</title>
    <style>
    body{
        background-image:url("abu.jpg");
        background-repeat: no-repeat;
        background-size: cover;
        font-family:'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', "Geneva", Verdana, sans-serif;

    }

    /* Lista pilotos */
    #contenedor {
        background-color: rgba(52, 52, 52, 0.699);
        border-top-left-radius: 10px;
        border-bottom-left-radius: 10px;
        width: 300px;

        margin: 20px 0px 0px 5px;

        display: flex;
        flex-direction: column;
    }
    .fila {
        display: flex;
        flex-direction: row;
        border: 2px solid black;
        height: 35px;
        padding: 5px;
    }

    .numero {
        flex: 1;
        background-color: white;
        border: 2px solid black;

        border-radius: 8px;

        display: flex;
        align-items: center;
        justify-content: center;

        font-size: 20px;
    }
    .resto {
        flex:5;
        display: flex;
        flex-direction: row;
    }
    .nombre,.tiempo, #cabecera {
        flex:1;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 30px;
        font-weight: bold;

        text-transform: uppercase;
        color: white;
        /*  https://css-tricks.com/adding-stroke-to-web-text/ */
        -webkit-text-stroke: 1px black;
    }

    /* Tiempo de vuelta */

    .liveTime {
        background-color: rgba(52, 52, 52, 0.941);
        width: 30%;
        font-weight: bold;
        border: 7px ridge black;
        text-transform: uppercase;
        color: white;
    }


    .filaBajaLT, .filaMediaLT, .filaAltaLT {
        display: flex;
        flex-direction: row;
    }
    .filaBajaLT *, .filaMediaLT * {
        flex:1;
        text-align: center;
    }

    .filaArribaLT {
        display: flex;
        flex-direction: row;
        background-color: rgba(255, 255, 255, 0.604);
    }
    .filaArribaLT {
        color: black;
        -webkit-text-stroke: none;
    }
    .filaArribaLT .nombreLT {
        text-align: center;
        font-size: 25px;
        flex: 9
    }
    .filaArribaLT .numero {
    flex: 1
    }
    .filaMediaLT {
        font-size: 20px;
        margin-left: 15px;
        margin-right: 15px;
    }

    .filaMedia1{
        display: flex;
        flex-direction: column;
    }

    .filaMedia2 {
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .filaBajaLT * {
        border: 2px solid black;
    }
    progress{
        width: 100%;
    }

    /* https://www.tutorialspoint.com/how-to-set-color-of-progress-bar-using-html-and-css#:~:text=CSS%20provides%20the%20%3A%3A%2Dwebkit,style%20on%20a%20progress%20bar.&text=We%20target%20both%20the%20%3A%3A%2D,and%20set%20their%20background%20colors. */
    #prog1::-webkit-progress-value {
        background-color: red;
    }
    #prog3::-webkit-progress-value {
        background-color: purple;
    }
    </style>
</head>
<body>
    <main>
        <div id = "contenedor">
            <div id = "cabecera">
                <h2>CABECERA</h2>
            </div>
            <div class = "fila">
                <div class = "numero">
                    1
                </div>
                <div class = "resto">
                    <div class = "nombre">
                        ric
                    </div>
                    <div class = "tiempo">
                        Leader
                    </div>
                </div>
            </div>
        </div>
        <div id = "divBotones">
            <button onclick="sumaPiloto()"> Añadir piloto</button>
            <button onclick="quitaPiloto()"> Quitar piloto</button>
        </div>
    
    <div class = "liveTime">
        <div class = "filaArribaLT">
            <div class = numero>
                1
            </div>
            <div class = nombreLT>
                Ricardo Román
            </div>
            <div>

            </div>
        </div>
        <div class = "filaMediaLT">
            <div class = "filaMedia1">
                <div>
                    1:16:0
                </div>
                <div>
                    ABEL
                </div>
            </div>
            <div class = "filaMedia2">
                1:15:9
            </div>

        </div>
        <div class = "filaBajaLT">
            <div class = "S1">
                S1
                <progress id ="prog1" value="0" max="100"></progress>
            </div>
            <div class = "S2">
                S2
                <progress id = "prog2"value="0" max="100"></progress>
            </div>
            <div class = "S3">
                S3
                <progress id = "prog3" value="0" max="100"></progress>                
            </div>
        </div>
        
    </div>

    </main>


    <script>
        // Lista Pilotos
        var pilotos = ["ric","jaw","abe"]
        var i = 0
        var HUD = document.getElementById("contenedor")
        var filas = document.getElementsByClassName("fila")


        function creaFila(nom,pos,tiemp){
            let fila = document.createElement("div")
            fila.className = "fila"
            let numero = document.createElement("div")
            numero.className = "numero"
            numero.textContent = pos
            let resto = document.createElement("div")
            resto.className = "resto"

            let nombre = document.createElement("div")
            nombre.className = "nombre"
            nombre.textContent = nom
            let tiempo = document.createElement("div")
            tiempo.className = "tiempo"
            if (i ==0){
                tiempo.textContent = "LEADER"
            }else{
                tiempo.textContent = tiemp
            }
            

            resto.append(nombre,tiempo)
            fila.append(numero,resto)
            return fila
        }
        function sumaPiloto() {
            let piloto = pilotos[++i % 3];
            let nueva_fila = creaFila(piloto,i+1 , "+1 lap");
            HUD.append(nueva_fila);
        }
        function quitaPiloto() {
            if (filas.length > 0) {
                filas[filas.length - 1].remove();
                --i;
            }
        }

        // Live Timing

        var prog1 = document.getElementById("prog1")
        var prog2 = document.getElementById("prog2")
        var prog3 = document.getElementById("prog3")

        function updateProgressBar(progressBar) {
        progressBar.value += 10;

        if (progressBar.value >= 100) {
            progressBar.value = 0;
        }
    }
        function updateProgress() {
        let prog_actual;

        if (prog1.value < 100) {
            prog_actual = prog1;
        } else if (prog2.value < 100) {
            prog_actual = prog2;
        } else {
            prog_actual = prog3;
        }

        prog_actual.value += 10
        if (prog_actual.id == "prog3" && prog_actual.value == 100){
            return
        }else {
            setTimeout(updateProgress, 100);
        }
         
        }

updateProgress(); // Start the updateProgress function initially
    </script>
</body>
</html>
