<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>Subir Archivo</title>
  <link rel="stylesheet" href="../css/subir.css">
</head>
<body>
  <div class="wrapper">
    <div class="contenido">
      <h1 id="titulo">Subir archivo</h1>
      <a id="volver" href="index.html" class="inicio">Volver al inicio </a>
      <form action="/upload" method="POST" enctype="multipart/form-data" class="formulario">

        <label id="elegir" for="archivo" class="boton">Elegir Archivo</label>
        <input type="file" id="archivo" name="file" required>
        <div id="etiquetaArchivo">No se ha seleccionado ningún archivo</div> 
        <button type="submit" class="boton" id="subir" disabled>Subir Archivo</button>
      </form>
    </div>
  </div>
  
  <script src="../js/subir.js">
  </script>
</body>
</html>
