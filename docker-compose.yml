
services:

  # Orion is the context broker
  orion:
    image: telefonicaiot/fiware-orion
    hostname: orion
    container_name: fiware-orion
    depends_on:
      - mongo
    ports:
      - "1026:1026"
    command: -dbURI mongodb://mongo

  # Databases - Orion uses Mongo-DB
  mongo:
    image: mongo:6.0
    hostname: mongo
    container_name: db-mongo
    ports:
      - "27017:27017" 
    command: --nojournal
    volumes:
      - type: volume
        source: mongo-db
        target: /data
      #- type: bind
      #  source: ./mongodb
      #  target: /data
      #  read_only: false

  # Databases - Excel uses MySQL
  mariadb:
    image: mariadb
    hostname: mariadb
    container_name: mariadb
    ports:
      - "3306:3306"
    restart: always
    environment:
      MARIADB_DATABASE: xtrachallenge25
      MARIADB_USER: mysql
      MARIADB_PASSWORD: password
      MARIADB_ROOT_PASSWORD: password
    volumes:
      - type: volume
        source: mysql-db
        target: /var/lib/mysql
      - type: bind
        source: ./mysql
        target: /var/lib/mysql
        read_only: false

  xtraserver:
    image: avr24/xtraserver:v2.0
    hostname: xtraserver
    container_name: xtraserver
    depends_on:
      - orion
      - mariadb
    ports:
      - "80:80"
    restart: unless-stopped
    entrypoint: ["node", "server.js"]
    volumes:
      - type: bind
        source: ./server
        target: /home/app
        read_only: false

  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: mediamtx
    restart: unless-stopped
    ports:
      - "1935:1935"      # RTMP
      - "8554:8554"      # RTSP
      - "8888:8888"      # HLS
      - "8889:8889"      # WebRTC HTTP
      - "8189:8189/udp"  # WebRTC ICE/UDP
      - "9997:9997"      # API HTTP
    volumes:
      - type: bind
        source: ./mediamtx/mediamtx.yml
        target: /mediamtx.yml
        read_only: false
    environment:
      - MTX_PROTOCOLS=tcp
      - MTX_RTMPADDRESS=:1935
      - MTX_RTSPADDRESS=:8554
      - MTX_HLSADDRESS=:8888
      - MTX_WEBRTCADDRESS=:8889

volumes:
  mongo-db: ~